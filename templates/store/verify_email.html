{% extends 'base.html' %}{% block content %}<div class="form-card"><span class="eyebrow">EMAIL VERIFICATION</span><h1>Verify your email</h1><p>Enter the six-digit code sent to {{ email }}. In local development, find it in the VS Code terminal.</p><form method="post">{% csrf_token %}<label>Verification code<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label><button class="button full">Verify and create account</button></form></div>{% endblock %}
