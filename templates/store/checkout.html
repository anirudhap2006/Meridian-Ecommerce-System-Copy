{% extends 'base.html' %}{% block content %}<div class="form-card wide"><span class="eyebrow">CHECKOUT</span><h1>Choose delivery address</h1>{% if addresses %}<form method="post">{% csrf_token %}{% for a in addresses %}<label class="address-option"><input type="radio" name="address" value="{{ a.pk }}" required><span><b>{{ a.full_name }}</b><br>{{ a.line1 }}, {{ a.city }}, {{ a.state }} - {{ a.postal_code }} · {{ a.phone }}</span></label>{% endfor %}<h2>Order total ₹{{ total }}</h2><button class="button">Continue to payment</button></form>{% else %}<p>Add a delivery address first.</p><a class="button" href="{% url 'addresses' %}">Add address</a>{% endif %}</div>{% endblock %}
