{% extends 'base.html' %}{% block content %}<div class="form-card wide"><span class="eyebrow">DEMO CHECKOUT</span><h1>Payment</h1><p>Delivering to {{ address.full_name }}, {{ address.city }}. Total <b>₹{{ total }}</b></p><form method="post">{% csrf_token %}<label>Payment method<select name="method"><option value="DEMO_CARD">Demo card</option><option value="DEMO_UPI">Demo UPI</option></select></label><label>Simulation result<select name="outcome"><option value="success">Simulate success</option><option value="failure">Simulate failure</option></select></label><p class="hint">No real money is charged. Do not enter real card or UPI credentials.</p><button class="button full">Pay ₹{{ total }}</button></form></div>{% endblock %}
