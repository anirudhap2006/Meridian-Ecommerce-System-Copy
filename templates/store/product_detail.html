{% extends 'base.html' %}{% block content %}<div class="detail"><div class="detail-image">{% if product.image_url %}<img src="{{ product.image_url }}" alt="{{ product.name }}">{% else %}<span>{{ product.category.name|slice:':1' }}</span>{% endif %}</div><div><span class="eyebrow">{{ product.category.name }}</span><h1>{{ product.name }}</h1><p>{{ product.description }}</p><h2>₹{{ product.price }}</h2><p>{{ product.stock }} available</p><form method="post" action="{% url 'add_to_cart' product.pk %}">{% csrf_token %}<label>Quantity <input type="number" name="quantity" value="1" min="1" max="{{ product.stock }}"></label><button class="button">Add to cart</button></form></div></div>{% endblock %}
