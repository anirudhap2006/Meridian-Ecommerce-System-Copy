{% extends 'base.html' %}{% block content %}<div class="form-card wide"><h1>Delivery addresses</h1><form method="post">{% csrf_token %}{{ form.as_p }}<button class="button">Save address</button></form><h2>Saved addresses</h2>{% for a in addresses %}<p>{{ a.full_name }}, {{ a.line1 }}, {{ a.city }}, {{ a.state }} - {{ a.postal_code }}</p>{% empty %}<p>No saved addresses.</p>{% endfor %}</div>{% endblock %}
